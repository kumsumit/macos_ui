name: macos_ui
description: Flutter widgets and themes implementing the current macOS design language.
version: 2.2.2
homepage: "https://macosui.dev"
repository: "https://github.com/GroovinChip/macos_ui"

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  macos_window_utils: ^1.9.1
  gradient_borders: ^1.0.4
  appkit_ui_element_colors: ^1.0.1
  equatable: ^2.0.8
  vector_math: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  plugin:
    platforms:
      macos:
        package: dev.macosui.macos_ui
        pluginClass: MacOSUiPlugin
