name: macos_ui
description: Flutter widgets and themes implementing the current macOS design language.
version: 2.2.3
publish_to: none
homepage: "https://macosui.dev"
repository: "https://github.com/GroovinChip/macos_ui"

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_ui: ^1.1.6
  macos_window_utils: ^1.9.1
  gradient_borders: ^1.0.4
  appkit_ui_element_colors:
    git: https://github.com/kumsumit/appkit_ui_element_colors
  equatable: ^3.0.0
  vector_math: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  plugin:
    platforms:
      macos:
        package: dev.macosui.macos_ui
        pluginClass: MacOSUiPlugin
