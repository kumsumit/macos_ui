name: example
description: Demonstrates how to use the macos_ui package
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_ui: ^1.1.6

  cupertino_icons: ^1.0.9
  macos_ui:
    path: ..
  provider: ^6.1.5+1
  google_fonts: ^8.1.0
  url_launcher:
    git: https://github.com/kumsumit/url_launcher.git

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides: 
  plugin_platform_interface:
    git: https://github.com/kumsumit/plugin_platform_interface.git

flutter:
  assets:
    - assets/sf_symbols/
